# Render Blueprint: one web service running the Next.js pages and the
# Socket.io game server together (server.ts).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: board-game
    runtime: node
    plan: free
    # Install everything (build needs TypeScript/Tailwind), then build Next.js.
    # npm install (not npm ci) so a lockfile written by a newer npm on macOS,
    # which can miss Linux-only optional packages, doesn't fail the build.
    buildCommand: npm install --no-audit --no-fund && npm run build
    # Runs NODE_ENV=production tsx server.ts; Render provides PORT
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
