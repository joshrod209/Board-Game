# Render Blueprint: one web service running the Next.js pages and the
# Socket.io game server together (server.ts).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: board-game
    runtime: node
    plan: free
    # Install everything (build needs TypeScript/Tailwind), then build Next.js
    buildCommand: npm ci && npm run build
    # Runs NODE_ENV=production tsx server.ts; Render provides PORT
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
